packages:
  - apps/*
  - packages/*

allowBuilds:
  '@firebase/util': true
  esbuild: true
  protobufjs: true
  re2: true

minimumReleaseAgeExclude:
  - uuid@11.1.1
  - fast-uri@3.1.4 || 3.1.5 || 3.1.6
  - brace-expansion@1.1.17 || 1.1.18 || 2.1.3 || 2.1.4 || 5.0.8 || 5.0.9
  - postcss@8.5.23
  - undici@6.28.0 || 8.9.0
  - ip-address@10.2.1 || 10.2.2 || 10.3.1
  - hono@4.12.34 || 4.13.5
  - js-yaml@4.3.1 || 4.3.2
  - re2@1.26.1
  - '@hono/node-server@1.19.15'
  - nanoid@3.3.18
  - tar@7.5.21
  - browserslist@4.28.7
  - '@opentelemetry/core@2.8.0'
  - qs@6.15.4 || 6.16.0
  - stream-json@3.4.1
  - csv-parse@7.0.2
  - vitest@4.1.11
  - '@vitest/mocker@4.1.11'
  - baseline-browser-mapping@2.11.0
  - morgan@1.12.0

overrides:
  '@opentelemetry/core@<2.8.0': ^2.8.0
  csv-parse@<7.0.2: ^7.0.2
  nanoid@<3.3.18: ^3.3.18
  postcss@<=8.5.22: ^8.5.23
  qs@>=2.2.5 <6.16.0: ^6.16.0
  qs@>=6.14.2 <=6.15.3: ^6.15.4
  uuid@<11.1.1: ^11.1.1
